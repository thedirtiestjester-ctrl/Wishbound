name: Import Selected ZIP Characters

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/import-selected-zip-characters.yml'
  workflow_dispatch:

jobs:
  import:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Pillow
        run: python -m pip install --quiet pillow

      - name: Download reviewed candidate artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/candidates
          curl -fL             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/11478657096/zip"             -o /tmp/candidates.zip
          unzip -q /tmp/candidates.zip -d /tmp/candidates
          test -f /tmp/candidates/manifest.json

      - name: Build six Wishbound ZIP-derived sprites
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import json, hashlib

          src = Path("/tmp/candidates")
          dst = Path("game/images/characters")
          dst.mkdir(parents=True, exist_ok=True)

          # Visually reviewed, adult-looking, non-explicit candidates.
          chosen = {
              "avery": 54,
              "mia": 58,
              "chloe": 226,
              "naomi": 61,
              "lila": 63,
              "rhea": 225,
          }

          rows = json.loads((src / "manifest.json").read_text(encoding="utf-8"))
          out_manifest = {}

          for route, idx in chosen.items():
              row = rows[idx - 1]
              p = src / f"orig_{idx:04d}.png"
              im = Image.open(p).convert("RGBA")
              alpha = im.getchannel("A")
              bbox = alpha.getbbox()
              if not bbox:
                  raise SystemExit(f"No visible pixels in candidate {idx}")
              im = im.crop(bbox)

              # Normalize to a consistent transparent VN sprite canvas.
              max_w, max_h = 620, 860
              scale = min(max_w / im.width, max_h / im.height, 1.75)
              size = (max(1, round(im.width * scale)), max(1, round(im.height * scale)))
              im = im.resize(size, Image.Resampling.LANCZOS)

              canvas = Image.new("RGBA", (700, 900), (0, 0, 0, 0))
              x = (700 - im.width) // 2
              y = 900 - im.height
              canvas.alpha_composite(im, (x, y))

              out = dst / f"{route}.png"
              canvas.save(out, optimize=True)

              digest = hashlib.sha256(out.read_bytes()).hexdigest()
              out_manifest[route] = {
                  "wishbound_character": route,
                  "review_candidate": idx,
                  "runtime_path": f"images/characters/{route}.png",
                  "sha256": digest,
                  "review_status": "adult_looking_non_explicit",
              }

          m = Path("AstRef/manifests/zip_character_set.json")
          m.parent.mkdir(parents=True, exist_ok=True)
          m.write_text(json.dumps({
              "version": 1,
              "identity_model": "wishbound_native",
              "characters": out_manifest,
          }, indent=2), encoding="utf-8")
          print("Imported:", ", ".join(chosen))
          PY

      - name: Remove obsolete geometric sprite placeholders
        shell: bash
        run: |
          set -euo pipefail
          for f in             game/images/sprite_avery_lane.png             game/images/sprite_mia_hart.png             game/images/sprite_chloe_vale.png             game/images/sprite_naomi_cross.png             game/images/sprite_lila_morgan.png             game/images/sprite_rhea_park.png
          do
            if [ -e "$f" ]; then git rm -f "$f"; fi
          done

      - name: Commit ZIP-derived character set
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "wishbound-astref-bot"
          git config user.email "actions@users.noreply.github.com"
          git add game/images/characters AstRef/manifests/zip_character_set.json
          if ! git diff --cached --quiet; then
            git commit -m "Replace temporary characters with reviewed ZIP-derived sprites [skip ci]"
            git push origin HEAD:main
          fi
