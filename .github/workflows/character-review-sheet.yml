        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/candidates
          for i in $(seq 1 12); do
            uk="U$i"; nk="N$i"
            url="${!uk}"; name="${!nk}"
            curl -fL "$url" -o "/tmp/candidates/$name"
          done
      - name: Build contact sheet
        shell: bash
        run: |
          python - <<'PY'
          from PIL import Image,ImageOps,ImageDraw,ImageFont
          from pathlib import Path
          files=sorted(Path('/tmp/candidates').glob('*'))
          cellw,cellh=420,620
          sheet=Image.new('RGB',(cellw*4,cellh*3),(30,30,30))
          font=ImageFont.load_default()
          for idx,p in enumerate(files):
              im=Image.open(p).convert('RGBA')
              bg=Image.new('RGBA',im.size,(180,180,180,255)); bg.alpha_composite(im)
              pic=ImageOps.contain(bg.convert('RGB'),(380,540))
              x=(idx%4)*cellw+(cellw-pic.width)//2
              y=(idx//4)*cellh+20
              sheet.paste(pic,(x,y))
              d=ImageDraw.Draw(sheet)
              d.text(((idx%4)*cellw+12,(idx//4)*cellh+570),p.name,fill='white',font=font)
          sheet.save('/tmp/contact_sheet.jpg',quality=90)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: character-review-sheet
          path: /tmp/contact_sheet.jpg