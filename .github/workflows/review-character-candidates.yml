        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/wb
          for n in $(seq -w 1 10); do
            key="P${n}"
            url="${!key}"
            curl -fL --retry 2 --retry-delay 1 "$url" -o "/tmp/wb/part_${n}.zip"
          done
      - name: Extract likely transparent character candidates
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import zipfile, io, json, hashlib
          from PIL import Image
          out=Path('/tmp/candidates'); out.mkdir(parents=True,exist_ok=True)
          rows=[]; seen=set(); idx=0
          for zpath in sorted(Path('/tmp/wb').glob('*.zip')):
              with zipfile.ZipFile(zpath) as z:
                  for n in z.namelist():
                      if Path(n).suffix.lower() not in {'.png','.webp'}: continue
                      data=z.read(n)
                      h=hashlib.sha256(data).hexdigest()
                      if h in seen: continue
                      seen.add(h)
                      try:
                          im=Image.open(io.BytesIO(data)).convert('RGBA')
                      except Exception: continue
                      w,hgt=im.size
                      a=im.getchannel('A')
                      bbox=a.getbbox()
                      if not bbox: continue
                      bw,bh=bbox[2]-bbox[0],bbox[3]-bbox[1]
                      alpha_pixels=sum(1 for p in a.getdata() if p<250)
                      transparent_ratio=alpha_pixels/(w*hgt)
                      # Character-layer candidates: meaningful transparency, portrait/tall bounds.
                      if transparent_ratio < .08 or bh < 300 or bh < bw*1.15: continue
                      idx+=1
                      fn=f'cand_{idx:04d}.png'
                      # Composite on neutral gray for review, preserving original separately.
                      canvas=Image.new('RGBA', im.size, (128,128,128,255)); canvas.alpha_composite(im)
                      canvas.convert('RGB').thumbnail((480,720))
                      canvas.convert('RGB').save(out/fn)
                      (out/f'orig_{idx:04d}.png').write_bytes(data)
                      rows.append({'candidate':fn,'original':f'orig_{idx:04d}.png','zip':zpath.name,'path':n,'size':[w,hgt],'bbox':[bw,bh],'transparent_ratio':round(transparent_ratio,4),'sha256':h})
                      if idx>=180: break
              if idx>=180: break
          (out/'manifest.json').write_text(json.dumps(rows,indent=2),encoding='utf-8')
          print('candidates',len(rows))
          PY
      - name: Upload review artifact
        uses: actions/upload-artifact@v4
        with:
          name: astref-character-candidates
          path: /tmp/candidates
          if-no-files-found: error