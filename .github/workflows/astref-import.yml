        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/wbasts
          for n in $(seq -w 1 10); do
            key="URL_${n}"
            url="${!key}"
            curl -fL --retry 3 --retry-delay 2 "$url" -o "/tmp/wbasts/Wbasts_Part_${n}.zip"
          done

      - name: Build AstRef safety-filtered import
        shell: bash
        run: |
          set -euo pipefail
          python tools/ingest_wbasts_to_astref.py /tmp/wbasts/Wbasts_Part_*.zip
          mkdir -p AstRef/manifests
          python - <<'PY'
          from pathlib import Path
          import csv, json
          p=Path('AstRef/manifests/wbasts_files.csv')
          rows=list(csv.DictReader(p.open(encoding='utf-8'))) if p.exists() else []
          summary={
            'records':len(rows),
            'eligible_for_repo':sum(r['status']=='eligible_for_repo' for r in rows),
            'excluded_safety':sum(r['status']=='excluded_safety' for r in rows),
          }
          Path('AstRef/manifests/import_summary.json').write_text(json.dumps(summary,indent=2),encoding='utf-8')
          print(summary)
          PY

      - name: Commit eligible AstRef files and manifests
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "wishbound-astref-bot"
          git config user.email "actions@users.noreply.github.com"
          git add AstRef/raw AstRef/manifests
          if ! git diff --cached --quiet; then
            git commit -m "Import safety-filtered AstRef image library [skip ci]"
            git push origin HEAD:main
          fi