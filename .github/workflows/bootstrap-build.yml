name: Bootstrap Wishbound v0.2 and Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  ANDROID_NDK_HOME: ""

jobs:
  bootstrap-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct Wishbound source
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap/source_payload/part_*.b64 | base64 -d > /tmp/wishbound-textsrc.tar.gz
          tar -xzf /tmp/wishbound-textsrc.tar.gz -C "$GITHUB_WORKSPACE"
          python3 -m pip install --quiet pillow
          python3 tools/generate_assets.py
          cp android.json .android.json
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          pngs=list(Path("game").rglob("*.png"))
          assert len(pngs) >= 23, len(pngs)
          for p in pngs:
              Image.open(p).verify()
          print("Validated", len(pngs), "generated PNG assets")
          PY

      - name: Install final Android workflow
        shell: bash
        run: |
          cat > .github/workflows/android-apk.yml <<'YAML'
          name: Build Android APK
          on:
            workflow_dispatch:
            push:
              branches: [ main ]
              paths:
                - 'game/**'
                - 'android.json'
                - 'tools/generate_assets.py'
                - '.github/workflows/android-apk.yml'

          env:
            ANDROID_NDK_HOME: ""

          jobs:
            android-apk:
              runs-on: ubuntu-latest
              permissions:
                contents: read
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-java@v4
                  with:
                    distribution: temurin
                    java-version: '21'
                - name: Materialize Android config
                  run: cp android.json .android.json
                - name: Create temporary sideload signing key
                  shell: bash
                  run: |
                    keytool -genkeypair -v \
                      -keystore "$GITHUB_WORKSPACE/android.keystore" \
                      -storepass android \
                      -alias android \
                      -keypass android \
                      -keyalg RSA -keysize 2048 -validity 10000 \
                      -dname "CN=Wishbound CI,O=Wishbound,C=US"
                - name: Install Ren'Py, RAPT, and Android SDK
                  uses: Ayowel/renpy-setup-action@v3
                  with:
                    action: install
                    version: '8.5.3'
                    dlc: rapt
                    android_sdk: true
                    android_properties: |
                      key.alias=android
                      key.store.password=android
                      key.alias.password=android
                      key.store=\${{ github.workspace }}/android.keystore
                - name: Lint project
                  uses: Ayowel/renpy-setup-action@v3
                  with:
                    action: lint
                    version: '8.5.3'
                - name: Build universal APK
                  uses: Ayowel/renpy-setup-action@v3
                  with:
                    action: android_build
                    version: '8.5.3'
                    build_type: apk
                    out_dir: target
                - name: Upload APK artifact
                  uses: actions/upload-artifact@v4
                  with:
                    name: wishbound-v0.2-apk
                    path: target/**/*.apk
                    if-no-files-found: error
          YAML

      - name: Expand repository source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf bootstrap
          rm -f .github/workflows/bootstrap-build.yml
          git config user.name "wishbound-build-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Expand Wishbound v0.2 source and generated assets [skip ci]"
            git push origin HEAD:main
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Create temporary sideload signing key
        shell: bash
        run: |
          keytool -genkeypair -v \
            -keystore "$GITHUB_WORKSPACE/android.keystore" \
            -storepass android \
            -alias android \
            -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Wishbound CI,O=Wishbound,C=US"

      - name: Install Ren'Py, RAPT, and Android SDK
        uses: Ayowel/renpy-setup-action@v3
        with:
          action: install
          version: '8.5.3'
          dlc: rapt
          android_sdk: true
          android_properties: |
            key.alias=android
            key.store.password=android
            key.alias.password=android
            key.store=\${{ github.workspace }}/android.keystore

      - name: Lint Ren'Py project
        uses: Ayowel/renpy-setup-action@v3
        with:
          action: lint
          version: '8.5.3'

      - name: Build universal APK
        uses: Ayowel/renpy-setup-action@v3
        with:
          action: android_build
          version: '8.5.3'
          build_type: apk
          out_dir: target

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wishbound-v0.2-apk
          path: target/**/*.apk
          if-no-files-found: error
