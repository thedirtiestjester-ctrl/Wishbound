name: Test Dropbox Asset Source

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/test-dropbox-source.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Download shared Dropbox folder
        shell: bash
        run: |
          set -euo pipefail
          url='https://www.dropbox.com/scl/fo/k883fw760e8rozstcuojg/AKcf1HggQsJOKBLeuP9aYjQ?rlkey=fu8nosqtfnie0e77rcbarceom&st=d3flcuhn&dl=1'
          curl -fL --retry 3 --retry-delay 2 "$url" -o /tmp/assets.zip
          file /tmp/assets.zip
          du -h /tmp/assets.zip
          unzip -t /tmp/assets.zip >/dev/null
          unzip -l /tmp/assets.zip | tail -n 5
