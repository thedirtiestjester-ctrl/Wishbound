name: Review New Character Assets

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/review-character-assets.yml'
  workflow_dispatch:

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Download candidate archive parts
        env:
          P4: https://uce37286bc595ed8afbca4b191c5.dl.dropboxusercontent.com/cd/0/get/DJjq_ouCWKuEPjp4CnrigUtt3gIDVg3P8niocHgCfLUv8L6TEl5zA67iBmLRuPnGlbXdsqgXNgpc9mztDi7yQSx5bOiR8yRRtHYCAakFgvmHK7CMLkfHFTcXZ0wdSp_Qx20YFd0UGsMseGyfkK4nsvQkGB9Sae-EIDlvb9SL_RkoOg/file?c_luid=1f041b3d
          P5: https://uc256c00f3e598918f1dea03bba6.dl.dropboxusercontent.com/cd/0/get/DJj5vRTncFmnA5hGDrutCNJCXGZGh2oZu1tEVxo8za-hET4zZKOx0l7USNnPgad6IMa5LPuO857YGEHxFWqpWMjKGHeCxYFsPOktve2txVqOyKD6YzOLmBMnOEiSyfti2Wgz_q4Ls4zDRyCdvcIk52SWElcFztSJRn9f31LFlO92Og/file?c_luid=1f041b3d
          P6: https://uc7a159834b7dfd44e9ff8326ec9.dl.dropboxusercontent.com/cd/0/get/DJi491fEmc93uNT9fYHLZOe7q6tfu2J2C4X3ShAPHFEgmOGoOq-WwMOpbIPmGU7O_m-04Njby6SnNn3r9XtsOmBpSscIl9YzV3vDpd1Ep4IU61LO0XEnhCLUsmGhTnv6qmeb_K8EOkrbALMOyTDypPzQTRw1kOS-fNmnLFnd2Xmyzg/file?c_luid=1f041b3d
          P7: https://ucc6287082989892602a1db3b28a.dl.dropboxusercontent.com/cd/0/get/DJisuRbfMMH9yr6wSxI_iGy62WlQPPQvEl130hC_a6Ik-_uE8MwDrdNnh9kyjw49jbysAWcd5B1GM-OCHXaphfqbtbO45IkedLt3QCz9B0fT_6HifFnNIwaAWHHDN5DVuYSGxMEHX-ICS_T59ViFMiXkmScQQQ5Z4jY1Tk4MOqzvng/file?c_luid=1f041b3d
        run: |
          mkdir -p /tmp/wbchar
          curl -fL "$P4" -o /tmp/wbchar/p4.zip
          curl -fL "$P5" -o /tmp/wbchar/p5.zip
          curl -fL "$P6" -o /tmp/wbchar/p6.zip
          curl -fL "$P7" -o /tmp/wbchar/p7.zip
      - name: Build character review artifact
        run: |
          python -m pip install pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps, ImageDraw
          import zipfile, io, csv, hashlib, re, os
          out=Path('/tmp/review'); out.mkdir(parents=True,exist_ok=True)
          candidates=[]
          seen=set()
          for zp in sorted(Path('/tmp/wbchar').glob('*.zip')):
              with zipfile.ZipFile(zp) as z:
                  for n in z.namelist():
                      if Path(n).suffix.lower() not in {'.png','.webp'}: continue
                      try:
                          data=z.read(n)
                          h=hashlib.sha256(data).hexdigest()
                          if h in seen: continue
                          im=Image.open(io.BytesIO(data)).convert('RGBA')
                      except Exception:
                          continue
                      if im.width < 280 or im.height < 450: continue
                      alpha=im.getchannel('A')
                      amin,amax=alpha.getextrema()
                      if amin==255: continue
                      bbox=alpha.getbbox()
                      if not bbox: continue
                      bw,bh=bbox[2]-bbox[0],bbox[3]-bbox[1]
                      if bh < 380 or bw < 120: continue
                      # Prefer tall, layered character art and skip obvious tiny overlays.
                      ratio=bh/max(bw,1)
                      if ratio < 1.15: continue
                      seen.add(h)
                      candidates.append((n,data,im,bbox,ratio,h))
          # Spread selection across path prefixes rather than taking one sequence only.
          groups={}
          for c in candidates:
              stem=re.sub(r'[_-]?\d+$','',Path(c[0]).stem)
              key=(Path(c[0]).parts[-2] if len(Path(c[0]).parts)>1 else '', stem[:12])
              groups.setdefault(key,[]).append(c)
          chosen=[]
          for k in sorted(groups):
              chosen.append(groups[k][0])
              if len(chosen)>=48: break
          rows=[]
          thumbs=[]
          for i,(n,data,im,bbox,ratio,h) in enumerate(chosen,1):
              fn=f'candidate_{i:03d}.png'
              crop=im.crop(bbox)
              # Composite on neutral gray only for review; preserve original separately.
              canvas=Image.new('RGBA',(320,520),(38,38,44,255))
              thumb=ImageOps.contain(crop,(300,480))
              canvas.alpha_composite(thumb,((320-thumb.width)//2,10+(480-thumb.height)//2))
              d=ImageDraw.Draw(canvas)
              d.rectangle((0,490,320,520),fill=(0,0,0,190))
              d.text((8,496),f'{i:03d} {Path(n).name[:26]}',fill='white')
              canvas.convert('RGB').save(out/fn,quality=92)
              (out/f'original_{i:03d}{Path(n).suffix.lower()}').write_bytes(data)
              rows.append([i,n,im.width,im.height,ratio,h])
              thumbs.append(canvas.convert('RGB'))
          if not thumbs:
              raise SystemExit('No character candidates found')
          cols=6; tw,th=320,520
          rows_n=(len(thumbs)+cols-1)//cols
          sheet=Image.new('RGB',(cols*tw,rows_n*th),(18,18,22))
          for i,t in enumerate(thumbs):
              sheet.paste(t,((i%cols)*tw,(i//cols)*th))
          sheet.save(out/'contact_sheet.jpg',quality=88)
          with (out/'manifest.csv').open('w',newline='',encoding='utf-8') as f:
              w=csv.writer(f); w.writerow(['candidate','original_path','width','height','ratio','sha256']); w.writerows(rows)
          print('selected',len(rows),'from',len(candidates),'candidates')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: character-review
          path: /tmp/review
          if-no-files-found: error
