version: 1
canonical_id: wishbound_asset_id
id_pattern: "WB-AST-#####"
public_fields:
  - wishbound_asset_id
  - wishbound_pool
  - wishbound_character
  - wishbound_route
  - wishbound_role
  - wishbound_scene_type
  - wishbound_outfit
  - wishbound_expression
  - assignment_status
  - runtime_filename
  - runtime_path
  - sha256
  - publication_state

private_only_fields:
  - source_id
  - archive_name
  - original_path

assignment_statuses:
  - unassigned
  - assigned
  - approved

publication_states:
  - review_required
  - cleared
  - local_only
  - blocked

runtime_roots:
  character: game/images/routes/<route>/character/
  expression: game/images/routes/<route>/expression/
  outfit: game/images/routes/<route>/outfit/
  accessory: game/images/routes/<route>/accessory/
  portrait: game/images/routes/<route>/portrait/
  background: game/images/routes/<route>/background/
  cg: game/images/routes/<route>/cg/
  phone: game/images/routes/<route>/phone/
  effect: game/images/effects/
  transition: game/images/effects/transitions/
  ui: game/gui/
