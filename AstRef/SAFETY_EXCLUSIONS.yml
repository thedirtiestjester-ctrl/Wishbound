version: 2
policy: >
  Wishbound recontextualization changes narrative identity, not the visual content itself.
  Assets are reviewed by what is visibly depicted. Anything that cannot be safely treated
  as adult/nonsexual or otherwise allowed remains unpublished.

blocked_pool_ids:
  - WBPOOL-A
  - WBPOOL-B
  - WBPOOL-C
  - WBPOOL-D

public_reason_code: age_or_context_verification_required

notes:
  - ownership/redistribution permission is recorded separately
  - prior story names and descriptions are intentionally omitted from public/runtime metadata
  - assets can move from blocked to eligible only after image-level review
