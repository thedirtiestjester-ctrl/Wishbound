publication_gates:
  - "Rights status must be cleared."
  - "Character must be explicitly adult for mature-route use."
  - "No age-ambiguous sexual source material."
  - "No third-party branding retained unless separately permitted."
  - "Wishbound filename and route role must be assigned."
